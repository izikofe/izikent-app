<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#607f87">
<meta name="app-version" content="9.5-login-fix">
<meta name="description" content="ИзиКент — помощник команды ИзиКофе">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>ИзиКент</title>
<style>
:root{--blue:#607f87;--dark:#355762;--light:#dce7e7;--cream:#f6f0e6;--paper:#fffdf8;--ink:#392820;--line:#e6ddd0;--muted:#82786f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 8%,#f6f0e6 0,transparent 34%),radial-gradient(ellipse at 88% 38%,#7f9b99 0,transparent 38%),linear-gradient(145deg,#355762,#607f87 52%,#dce7e7);background-attachment:fixed;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{max-width:520px;min-height:100vh;margin:0 auto;padding-bottom:100px;background:linear-gradient(180deg,#35576235,#607f8730 42%,#f6f0e655);backdrop-filter:blur(18px)}
header{background:linear-gradient(135deg,#355762d9,#607f87c9);color:#fff;padding:22px 22px 25px;border-radius:0 0 30px 30px;position:relative;overflow:hidden;border-bottom:1px solid #ffffff55}
header:after{content:"";position:absolute;width:190px;height:190px;background:#ffffff12;border-radius:50%;right:-95px;top:-95px}
.header-row{display:flex;justify-content:flex-end;position:relative;z-index:1}.logout{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:15px;padding:8px 10px;font-size:12px;font-weight:700}
.hello{position:relative;z-index:1;margin-top:10px;font-size:23px;font-weight:800}.hello-sub{position:relative;z-index:1;color:#ffffffd9;font-size:13px;margin-top:5px}
main{padding:20px 16px}.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted);font-weight:750;margin:4px 2px 6px}h1{font-size:23px;margin:0 2px 15px;color:var(--dark)}
.card{background:#fffdf8c2;border:1px solid #ffffffc7;border-radius:24px;padding:17px;margin:14px 0;box-shadow:0 10px 26px rgba(28,55,58,.13),inset 0 1px 0 #ffffffd9;backdrop-filter:blur(22px)}
.card h2{font-size:17px;margin:0 0 7px;color:var(--dark)}.muted{color:var(--muted);font-size:13px;line-height:1.45}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:11px;padding:6px 9px;border-radius:30px;background:var(--light);color:var(--dark);font-weight:700}
.field-label{display:block;font-size:13px;font-weight:750;color:var(--dark);margin:14px 0 7px}
.field{width:100%;border:1px solid #ffffffd9;border-radius:15px;background:#fffdf8d9;padding:13px;color:var(--ink);outline:none;box-shadow:inset 0 1px 3px #35576212}
textarea.field{min-height:110px;resize:vertical}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #607f8730}
.primary{width:100%;border:1px solid #ffffff55;border-radius:17px;background:linear-gradient(135deg,#7b8058,#68764e);color:white;font-weight:800;padding:15px;margin-top:18px;box-shadow:0 8px 18px #59604440}.primary:disabled{opacity:.55;cursor:wait}
.secondary{border:1px solid #ffffffaa;border-radius:14px;background:#ffffff80;color:var(--dark);font-weight:750;padding:10px 13px;display:inline-flex;align-items:center;gap:7px}.mini-glass{display:inline-flex;width:20px;height:20px;align-items:center}.mini-glass svg{width:20px;height:20px;filter:drop-shadow(0 1px 2px #607f8740)}.logout{display:inline-flex;align-items:center;gap:6px}
.notice{background:#e8eadf;color:#596044;border-radius:14px;padding:12px;font-size:12px;line-height:1.4;margin-top:12px}.error{color:#a33b32;font-size:13px;line-height:1.4;margin-top:12px;min-height:18px}
.news-item{position:relative;padding:15px 0;border-bottom:1px solid var(--line)}.news-item:last-child{border:0;padding-bottom:0}.news-title{font-weight:800;font-size:17px;color:var(--dark);margin:0 0 7px}.news-body{font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.news-meta{font-size:11px;color:var(--muted);margin-top:9px}.pinned-label{position:absolute;top:15px;right:0;display:inline-block;margin:0;padding:0;background:none;color:var(--muted);font-size:12px;font-weight:400;line-height:1.4}
.profile-head{display:flex;align-items:center;gap:14px;padding:5px 0 15px}.avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;font-size:25px;font-weight:800}.profile-name{font-size:20px;font-weight:800}.profile-role{font-size:13px;color:var(--muted);margin-top:4px}.detail{padding:12px 0;border-top:1px solid var(--line)}.detail strong{display:block;margin-top:4px;font-size:14px}
.compose-toggle{margin:0 0 12px}.cancel-compose{width:100%;margin-top:8px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fffdf8e8;backdrop-filter:blur(18px);border:1px solid var(--line);border-bottom:0;border-radius:25px 25px 0 0;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -4px 18px #39282010}
.nav{border:0;background:transparent;color:#8d8984;font-size:11px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav .glass-icon{display:flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(145deg,#ffffffd9,#dce5eb8c);border:1px solid #ffffffed;box-shadow:0 4px 10px #607f8726,inset 0 1px 2px #fff}.glass-icon svg{width:25px;height:25px;filter:drop-shadow(0 2px 2px #607f8740)}.nav.active{color:var(--dark);font-weight:800}.nav.active .glass-icon{background:linear-gradient(145deg,#fff,#d6e2eb);box-shadow:0 4px 12px #607f8740,inset 0 1px 3px #fff}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}.login-shell{width:100%;max-width:440px}.login-intro{color:#fff;padding:0 8px 24px}.login-intro h1{font-size:34px;line-height:1.12;color:#fff;margin:0 0 12px}.login-intro p{font-size:16px;line-height:1.4;margin:0;color:#ffffffdf}
.login-card{background:#fffdf8c2;border:1px solid #ffffffc9;border-radius:30px;padding:26px 22px 22px;box-shadow:0 16px 38px #173a4033,inset 0 1px 0 #ffffffed;backdrop-filter:blur(26px)}
.select,.pin{width:100%;border:1px solid #ffffffd9;border-radius:18px;background:#fffdf8d9;padding:15px;color:var(--ink);outline:none}.pin{text-align:center;font-size:22px;letter-spacing:8px}
.login-foot{text-align:center;color:#655b51;font-size:11px;font-weight:700;letter-spacing:1px;margin-top:20px}
@media(min-width:600px){body{padding:24px 0}.app{border-radius:28px;overflow:hidden;min-height:850px;box-shadow:0 15px 50px #34271d20}.bottom{bottom:24px;border-radius:0 0 28px 28px}}
</style>
</head>
<body>
<section id="loginScreen" class="login-wrap">
 <div class="login-shell">
  <div class="login-intro"><h1>Добро пожаловать<br>в ИзиКент!</h1><p>Выбери своё имя и введи PIN-код</p></div>
  <div class="login-card">
   <form id="loginForm">
    <label class="field-label" for="employee">Сотрудник</label>
    <select class="select" id="employee" required><option value="">Загружаем сотрудников…</option></select>
    <label class="field-label" for="pin">PIN-код</label>
    <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" minlength="8" placeholder="••••••••" autocomplete="current-password" required>
    <button class="primary" id="loginButton" type="submit">Войти</button><div class="error" id="loginError" role="alert"></div>
   </form><div class="login-foot">ИЗИКОФЕ · ИЗИКЕНТ</div>
  </div>
 </div>
</section>
<div class="app hidden" id="appScreen">
 <header><div class="header-row"><button class="logout" id="logoutButton" type="button"><span class="mini-glass"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="glogout" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#dce5eb"/><stop offset="1" stop-color="#9aafc0"/></linearGradient></defs><g fill="url(#glogout)" stroke="#8da3b5" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/><path d="m14 8 4 4-4 4M8 12h10"/></g></svg></span>Выйти</button></div><div class="hello" id="helloText">Привет!</div><div class="hello-sub">Новости и важная информация команды.</div></header>
 <main>
  <section id="homePage">
   <div class="eyebrow">Рабочее пространство</div>
   <div class="row"><h1>Новости</h1><button class="secondary" id="refreshNews" type="button">↻ Обновить</button></div>
   <button class="primary compose-toggle hidden" id="composeToggle" type="button">＋ Написать новость</button>
   <form class="card hidden" id="newsForm">
    <label class="field-label" for="newsTitle">Заголовок</label><input class="field" id="newsTitle" maxlength="200" required>
    <label class="field-label" for="newsText">Текст новости</label><textarea class="field" id="newsText" maxlength="10000" required></textarea>
    <label class="field-label" for="newsImage">Изображение (необязательно)</label><input class="field" id="newsImage" type="url" placeholder="Ссылка на изображение">
    <button class="primary" id="publishButton" type="submit">Опубликовать</button><button class="secondary cancel-compose" id="cancelCompose" type="button">Отмена</button>
    <div class="error" id="newsError" role="alert"></div><div class="notice hidden" id="newsSuccess" role="status"></div>
   </form>
   <div class="card" id="newsList"><p class="muted">Загружаем новости…</p></div>
  </section>
  <section id="profilePage" class="hidden"><div class="eyebrow">Личный кабинет</div><h1>Профиль</h1><div class="card"><div class="profile-head"><div class="avatar" id="profileAvatar">И</div><div><div class="profile-name" id="profileName"></div><div class="profile-role" id="profileRole"></div></div></div><div class="detail"><span class="muted">Торговые точки</span><strong id="profilePlaces">—</strong></div><div class="detail"><span class="muted">Доступные разделы</span><strong id="profilePermissions">—</strong></div></div></section>
 </main>
 <nav class="bottom"><button class="nav active" data-page="homePage"><span class="glass-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="4" width="14" height="18" rx="2.5"/><path d="M10 9h8M10 13h8M10 17h5"/></svg></span>Новости</button><button class="nav" data-page="profilePage"><span class="glass-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.4-6 8-6s7.3 2 8 6z"/></svg></span>Профиль</button></nav>
</div>
<script>
const API_URL='https://functions.yandexcloud.net/d4eg87r5uv033mv47vuq';
const SESSION_KEY='izikent_session_v2';
const $=id=>document.getElementById(id);
let currentUser=null;
function showLogin(){ $('appScreen').classList.add('hidden');$('loginScreen').classList.remove('hidden'); }
function showApp(user){currentUser=user;$('loginScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');$('helloText').textContent='Привет, '+user.name+'!';$('profileName').textContent=user.name;$('profileRole').textContent=user.role;$('profileAvatar').textContent=(user.name||'И').trim().charAt(0).toUpperCase();$('profilePlaces').textContent=(user.points||[]).join(', ')||'Не назначены';const p=user.permissions||{};const allowed=Object.keys(p).filter(k=>p[k]);$('profilePermissions').textContent=allowed.join(', ')||'Нет доступных разделов';$('composeToggle').classList.toggle('hidden',!p['Публикация новостей']);loadNews();}
function setPage(id){['homePage','profilePage'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='homePage')loadNews();window.scrollTo({top:0,behavior:'smooth'});}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function getSession(){try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null')}catch(e){return null}}
function clearSession(){sessionStorage.removeItem(SESSION_KEY);currentUser=null;showLogin();}
async function api(action,{method='GET',body=null,auth=true}={}){const s=getSession();const headers={};if(body!==null)headers['Content-Type']='application/json';if(auth&&s?.token)headers['X-Session-Token']=s.token;const response=await fetch(API_URL+'?action='+encodeURIComponent(action),{method,headers,body:body===null?undefined:JSON.stringify(body),cache:'no-store'});let data={};try{data=await response.json()}catch(e){throw new Error('Сервер вернул неверный ответ.')}if(response.status===401){clearSession();throw new Error(data.error||'Сессия закончилась. Войди заново.')}if(!response.ok||!data.ok)throw new Error(data.error||'Ошибка запроса.');return data;}
async function loadLoginUsers(){try{const data=await api('login-users',{auth:false});const select=$('employee');select.innerHTML='<option value="">Выбери сотрудника</option>';(data.users||[]).forEach(u=>{const o=document.createElement('option');o.value=u.name;o.textContent=u.name;select.append(o);});}catch(e){$('employee').innerHTML='<option value="">Не удалось загрузить список</option>';$('loginError').textContent=e.message;}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const name=$('employee').value,pin=$('pin').value.trim();if(!name||!/^\d{8}$/.test(pin)){$('loginError').textContent='Выбери сотрудника и введи PIN из 8 цифр.';return;}$('loginButton').disabled=true;$('loginButton').textContent='Проверяем…';try{const data=await api('login',{method:'POST',auth:false,body:{name,pin}});sessionStorage.setItem(SESSION_KEY,JSON.stringify({token:data.token,user:data.user,expiresAt:Date.now()+Number(data.expires_in||28800)*1000}));$('pin').value='';showApp(data.user);}catch(err){$('loginError').textContent=err.message;}finally{$('loginButton').disabled=false;$('loginButton').textContent='Войти';}});
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatDate(value){return value||'';}
async function loadNews(){const list=$('newsList');list.innerHTML='<p class="muted">Загружаем новости…</p>';try{const data=await api('news');if(!data.news?.length){list.innerHTML='<div class="news-empty"><div class="news-mark glass-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="gnews" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#dce5eb"/><stop offset="1" stop-color="#9aafc0"/></linearGradient></defs><g fill="url(#gnews)" stroke="#8da3b5" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="14" height="18" rx="2.5"/><path d="M10 9h8M10 13h8M10 17h5"/></g></svg></div><h2>Пока новостей нет</h2><p class="muted">Здесь появятся новости и объявления команды.</p></div>';return;}list.innerHTML='';data.news.forEach(n=>{const article=document.createElement('article');article.className='news-item';const image=n.image&&/^https?:\/\//i.test(n.image)?'<img src="'+escapeHtml(n.image)+'" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:15px;margin:8px 0">':'';article.innerHTML=(n.pinned?'<div class="muted pinned-label">ВАЖНАЯ🔥</div>':'')+'<h2 class="news-title">'+escapeHtml(n.title)+'</h2>'+image+'<div class="news-body">'+escapeHtml(n.text)+'</div><div class="news-meta">'+escapeHtml(n.author)+' · <span class="mini-glass"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="gcalendar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#dce5eb"/><stop offset="1" stop-color="#9aafc0"/></linearGradient></defs><g fill="url(#gcalendar)" stroke="#8da3b5" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="15" rx="2.5"/><path d="M8 3v6M16 3v6M4 11h16"/></g></svg></span> '+escapeHtml(formatDate(n.published_at))+'</div>';list.append(article);});}catch(e){list.innerHTML='<p class="error">'+escapeHtml(e.message)+'</p>';}}
$('refreshNews').addEventListener('click',loadNews);
$('composeToggle').addEventListener('click',()=>{$('newsForm').classList.toggle('hidden');$('composeToggle').classList.toggle('hidden');$('newsError').textContent='';$('newsSuccess').classList.add('hidden');});
$('cancelCompose').addEventListener('click',()=>{$('newsForm').reset();$('newsForm').classList.add('hidden');$('composeToggle').classList.remove('hidden');});
$('newsForm').addEventListener('submit',async e=>{e.preventDefault();$('newsError').textContent='';$('newsSuccess').classList.add('hidden');const body={title:$('newsTitle').value.trim(),text:$('newsText').value.trim(),publication_type:'Сразу',published_at:'',expires_at:'',audience:'Все сотрудники',roles:'',employees:'',places:'',pinned:false,image:$('newsImage').value.trim()};$('publishButton').disabled=true;$('publishButton').textContent='Публикуем…';try{await api('news-create',{method:'POST',body});$('newsForm').reset();$('newsForm').classList.add('hidden');$('composeToggle').classList.remove('hidden');loadNews();}catch(err){$('newsError').textContent=err.message;}finally{$('publishButton').disabled=false;$('publishButton').textContent='Опубликовать';}});
$('logoutButton').addEventListener('click',clearSession);
async function restoreSession(){const s=getSession();if(!s?.token||!s.expiresAt||s.expiresAt<=Date.now()){clearSession();return;}try{const data=await api('me');sessionStorage.setItem(SESSION_KEY,JSON.stringify({...s,user:data.user}));showApp(data.user);}catch(e){clearSession();}}
loadLoginUsers();restoreSession();
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});}
</script>
</body>
</html>
